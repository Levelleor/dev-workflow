name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: TypeScript, Vitest and package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Typecheck, build, test and smoke test
        run: npm run check
      - name: Exercise built CLI against a fresh repository
        run: |
          tmp="$(mktemp -d)"
          node packages/cli/dist/index.js init "$tmp"
          test -f "$tmp/.agentctl/project.yaml"
          test -f "$tmp/.agentctl/models.yaml"
          (cd "$tmp" && node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" doctor)
          cli="$GITHUB_WORKSPACE/packages/cli/dist/index.js"
          (cd "$tmp" && node "$cli" knowledge add --type prd --title "Smoke product")
          (cd "$tmp" && node "$cli" work add --title "Smoke implementation" --parent PRD-0001)
          (cd "$tmp" && node "$cli" work add --title "Explicitly selected" --parent PRD-0001)
          (cd "$tmp" && node "$cli" task claim STORY-0002 > "$tmp/claim-result.txt")
          grep -q "Claimed STORY-0002" "$tmp/claim-result.txt"
          if grep -q "Smoke product" "$tmp/claim-result.txt"; then
            echo "Claim returned context unexpectedly"
            exit 1
          fi
          (cd "$tmp" && node "$cli" config show --json > "$tmp/settings.json")
          node -e 'const d=require(process.argv[1]); if (!d.models.roles || d.models.repairRetries !== 2 || d.models.reviewRetries !== 2) process.exit(1)' "$tmp/settings.json"
          (cd "$tmp" && node "$cli" task getcontext STORY-0002 > "$tmp/resumed-prompt.md")
          grep -q "Explicitly selected" "$tmp/resumed-prompt.md"
          grep -q "Smoke product" "$tmp/resumed-prompt.md"
          if (cd "$tmp" && node "$cli" task complete STORY-0002 --json > "$tmp/unconfigured.json"); then
            echo "Completion unexpectedly passed without gates"
            exit 1
          fi
          grep -q "status: in-progress" "$tmp/docs/work/items/STORY-0002-explicitly-selected.md"
          (cd "$tmp" && node "$cli" verify add green -- node -e 'process.exit(0)')
          (cd "$tmp" && node "$cli" task complete STORY-0002)
          grep -q "status: implemented" "$tmp/docs/work/items/STORY-0002-explicitly-selected.md"
          (cd "$tmp" && node "$cli" task claim next > "$tmp/next-claim.txt")
          grep -q "Claimed STORY-0001" "$tmp/next-claim.txt"
          (cd "$tmp" && node "$cli" task notes add "Investigate smoke" --json > "$tmp/note.json")
          grep -q '"id": "N001"' "$tmp/note.json"
          (cd "$tmp" && node "$cli" task notes list --json > "$tmp/notes.json")
          grep -q "Investigate smoke" "$tmp/notes.json"
          (cd "$tmp" && node "$cli" task getcontext STORY-0001 > "$tmp/context-with-note.md")
          grep -q "Investigate smoke" "$tmp/context-with-note.md"
          (cd "$tmp" && node "$cli" task STORY-0001 notes remove N001)
          (cd "$tmp" && node "$cli" task STORY-0001 notes list --json > "$tmp/notes-after.json")
          node -e 'const d=require(process.argv[1]); if (d.notes.length) process.exit(1)' "$tmp/notes-after.json"
          (cd "$tmp" && node "$cli" verify list --json > "$tmp/gates.json")
          grep -q '"name": "green"' "$tmp/gates.json"
          (cd "$tmp" && node "$cli" verify --json > "$tmp/all-gates.json")
          node -e 'const d=require(process.argv[1]); if (!d.passed || d.checks.length !== 1) process.exit(1)' "$tmp/all-gates.json"
          (cd "$tmp" && node "$cli" verify green --json > "$tmp/green.json")
          node -e 'const d=require(process.argv[1]); if (!d.passed) process.exit(1)' "$tmp/green.json"
          (cd "$tmp" && node "$cli" verify add quoted -- node -e "process.stdout.write('quoted ok')")
          (cd "$tmp" && node "$cli" verify quoted --json > "$tmp/quoted.json")
          node -e 'const d=require(process.argv[1]); if (!d.passed || !d.checks[0].stdout.includes("quoted ok")) process.exit(1)' "$tmp/quoted.json"
          (cd "$tmp" && node "$cli" verify add red -- node -e 'process.exit(2)')
          if (cd "$tmp" && node "$cli" verify red --json > "$tmp/red.json"); then
            echo "A failing gate unexpectedly passed"
            exit 1
          fi
          node -e 'const d=require(process.argv[1]); if (d.passed || d.checks[0].exitCode !== 2) process.exit(1)' "$tmp/red.json"
      - name: Check npm package contents
        run: |
          npm pack --workspace @levelleor/agentctl --dry-run --json > pack.json
          node -e 'const p=require("./pack.json")[0]; const paths=p.files.map(f=>f.path); if (!paths.includes("dist/index.js") || !paths.includes("dist/templates/repository/AGENTS.md")) process.exit(1);'
