name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: TypeScript, Vitest and package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Typecheck, build, test and smoke test
        run: npm run check
      - name: Exercise built CLI against a fresh repository
        run: |
          tmp="$(mktemp -d)"
          node packages/cli/dist/index.js init "$tmp"
          test -f "$tmp/.agentctl/project.yaml"
          test -f "$tmp/.agentctl/models.yaml"
          (cd "$tmp" && node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" doctor)
          cli="$GITHUB_WORKSPACE/packages/cli/dist/index.js"
          (cd "$tmp" && node "$cli" knowledge add --type prd --title "Smoke product")
          (cd "$tmp" && node "$cli" work add --title "Smoke implementation" --parent PRD-0001)
          (cd "$tmp" && node "$cli" task claim next > "$tmp/claim-prompt.md")
          grep -q "Smoke implementation" "$tmp/claim-prompt.md"
          grep -q "Smoke product" "$tmp/claim-prompt.md"
          (cd "$tmp" && node "$cli" task getcontext > "$tmp/resumed-prompt.md")
          grep -q "Smoke implementation" "$tmp/resumed-prompt.md"
          (cd "$tmp" && node "$cli" task complete)
          grep -q "status: implemented" "$tmp/docs/work/items/STORY-0001-smoke-implementation.md"
      - name: Check npm package contents
        run: |
          npm pack --workspace @levelleor/agentctl --dry-run --json > pack.json
          node -e 'const p=require("./pack.json")[0]; const paths=p.files.map(f=>f.path); if (!paths.includes("dist/index.js") || !paths.includes("dist/templates/repository/AGENTS.md")) process.exit(1);'
