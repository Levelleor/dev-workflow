# Registered gates. 'agentctl verify' runs every gate in alphabetical order.
# 'agentctl verify add NAME -- COMMAND ...' appends gates without overwriting.
checks:
  scaffold:
    command: npm test
    timeoutSeconds: 120
  docs:
    command: npm run lint:docs
    timeoutSeconds: 120

profiles:
  scaffold: [scaffold]
  feature: []     # Must be defined and nonempty before feature acceptance.
  release: []     # Must be defined and nonempty before publishing.

# Missing or empty named profiles must never produce a successful verification.
policy:
  unconfiguredProfile: block
