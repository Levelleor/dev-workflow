schemaVersion: 1
project:
  id: dev-workflow
  displayName: dev-workflow
  repository: Levelleor/dev-workflow

storage:
  knowledge: repository
  runtime: local
  generatedIndex: false

knowledge:
  entrypoint: AGENTS.md
  roots:
    - docs/product
    - docs/architecture
    - docs/decisions
    - docs/knowledge
    - docs/work
  inbox: docs/knowledge/inbox

context:
  include:
    - AGENTS.md
    - docs/product/PRD-0001.md
    - docs/knowledge/README.md
  reference:
    - docs/architecture/overview.md
    - docs/decisions/README.md
    - docs/work/README.md

orchestration:
  engine: ultracode
  mode: sequential
  maxConcurrentWriters: 1
  integration: serial

configurationStatus: proposed
