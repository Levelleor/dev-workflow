# Proposed defaults, not an operational provider configuration.
schemaVersion: 1
roles:
  architect:
    model: openai/gpt-6.2-sol
    thinking: high
  worker:
    model: deepseek/deepseek-flash
    thinking: medium
  reviewer:
    model: deepseek/deepseek-flash
    thinking: medium
  curator:
    model: deepseek/deepseek-flash
    thinking: low

limits:
  worker:
    maxTurns: 50
    maxToolCalls: 150
    timeoutSeconds: 900
  reviewer:
    maxTurns: 15
    timeoutSeconds: 300
  repairRetries: 2
  reviewRetries: 1

# Provider identifiers, supported thinking levels and enforcement
# must be validated by the future runtime adapter before use.
